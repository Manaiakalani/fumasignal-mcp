name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned rather than the "v4" tag - see ci.yml for the rationale
      # shared by both workflows, and the changesets/action step below for
      # why this release job in particular (write + publish credentials)
      # is especially sensitive to a re-tagged action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Runs typecheck+lint+test+build (in that order), not just build:
      # `npm run build` alone only ran tsup, whose esbuild-based transpile
      # doesn't type-check and would happily emit a publishable bundle from
      # source with type errors, lint violations, or failing tests -
      # ci.yml's own test matrix runs against the *same* push event but is
      # a separate workflow with no `needs:` relationship to this one, so
      # it cannot actually block this job from publishing regardless of its
      # own result.
      - run: npm run check
      - name: Create release PR or publish
        # Pinned to a commit SHA rather than the "v2" ref: unlike
        # actions/* above (GitHub's own namespace), "v2" here is a mutable
        # major tag in a third-party repo, and this step runs with
        # contents/pull-requests write plus GITHUB_TOKEN and, when
        # configured, NPM_TOKEN. A compromised "v2" would get arbitrary
        # code execution with repo-write credentials and, if present,
        # npm-publish credentials.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changesets/action v2 renamed these inputs (publish ->
          # publish-script, version -> version-script) and requires
          # @changesets/cli v3. github-token is the supported way to pass
          # the token; GITHUB_TOKEN in env is no longer read by the action.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The package has never been published, and this repo has no
          # NPM_TOKEN secret, so a bare `npx changeset publish` fails
          # every main push with npm ENEEDAUTH once there are no pending
          # changesets (the action still attempts publish, and OIDC
          # trusted publishing is not configured on npmjs.com either).
          # `npm run changeset-publish` publishes to npm only when
          # NPM_TOKEN is set (passed through as NPM_TOKEN and
          # NODE_AUTH_TOKEN). Without the token it runs `npx changeset
          # git-tag` instead. The CLI writes git-tag events to the
          # CHANGESETS_OUTPUT file that this action reads, which is
          # enough to push a `v*` git tag and open a GitHub Release from
          # CHANGELOG.md. Version PRs still open as before via the
          # version-script input below. `npm run check` above is unchanged.
          publish-script: npm run changeset-publish
          # `changeset version` only rewrites package.json/CHANGELOG.md; it
          # never touches package-lock.json, so a bare `npx changeset
          # version` silently leaves the lockfile's "version" field
          # pointing at the *previous* release on every future bump
          # (exactly what happened for the 0.1.0 -> 0.1.1 jump). The
          # changesets/action `version-script` input is passed straight to
          # a single command invocation (it errors with "too many
          # arguments" on a compound `a && b` string), so the
          # lockfile-sync step lives in the "changeset-version" npm script
          # instead and this just calls that script.
          version-script: npm run changeset-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
